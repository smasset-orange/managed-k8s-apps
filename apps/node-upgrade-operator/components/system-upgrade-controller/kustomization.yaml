---
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - https://github.com/rancher/system-upgrade-controller/releases/download/v0.16.3/crd.yaml
  - https://github.com/rancher/system-upgrade-controller/releases/download/v0.16.3/system-upgrade-controller.yaml

patches:
  - target:
      kind: Deployment
      name: system-upgrade-controller
    patch: |-
      - op: remove
        path: /spec/template/spec/affinity/nodeAffinity/requiredDuringSchedulingIgnoredDuringExecution/nodeSelectorTerms/0/matchExpressions/0
